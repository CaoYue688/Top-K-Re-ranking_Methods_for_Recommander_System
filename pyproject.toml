[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "movielens20m-recsys"
version = "1.0.0"
description = "Reproducible MovieLens 20M BPR-MF recommendation and reranking pipeline"
readme = "README.md"
authors = [{ name = "Yue Cao" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "Pillow>=10.0",
  "torch>=2.13",
]

[tool.setuptools.packages.find]
where = ["src"]
